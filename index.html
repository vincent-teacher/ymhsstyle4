<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楊梅高中梅岡風</title>
<meta name="description" content="楊梅高中校刊《梅岡風》數位典藏：歷年各期版面線上閱讀、全文搜尋、時光軸與互動小遊戲。">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<!-- 飄落梅花背景 -->
<canvas id="petals" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="#/" data-sfx="click" aria-label="回首頁">
    <img class="brand-emblem" src="assets/emblem.png" alt="楊梅高中校徽">
    <span class="brand-text">
      <span class="brand-school">楊梅高中</span>
      <img class="brand-logo ink" src="assets/梅岡風Logo.png" alt="梅岡風">
    </span>
  </a>
  <nav class="mainnav" id="mainnav">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>首頁</a>
    <a href="#/issues" data-nav="issues"><svg class="ic"><use href="#i-grid"/></svg>歷年期刊</a>
    <a href="#/timeline" data-nav="timeline"><svg class="ic"><use href="#i-clock"/></svg>時光軸</a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg>全文搜尋</a>
    <a href="#/game" data-nav="game"><svg class="ic"><use href="#i-game"/></svg>猜猜哪一年</a>
    <a href="#/me" data-nav="me"><svg class="ic"><use href="#i-foot"/></svg>我的足跡</a>
    <a href="#/help" data-nav="help"><svg class="ic"><use href="#i-help"/></svg>說明</a>
  </nav>
  <div class="tools">
    <form class="quicksearch" id="quicksearch" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="qs" placeholder="搜尋校刊內文…" aria-label="搜尋校刊內文">
    </form>
    <button class="iconbtn" id="btnSound" title="音效開關" aria-label="音效開關"><svg class="ic"><use href="#i-sound"/></svg></button>
    <button class="iconbtn" id="btnSettings" title="設定" aria-label="設定"><svg class="ic"><use href="#i-gear"/></svg></button>
    <button class="iconbtn menu-toggle" id="btnMenu" title="選單" aria-label="選單"><svg class="ic"><use href="#i-menu"/></svg></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <div class="footer-inner">
    <img src="assets/emblem.png" alt="" class="footer-emblem">
    <div>
      <p class="footer-title">楊梅高中梅岡風 · 校刊數位典藏</p>
      <p class="footer-sub">國立楊梅高級中學 ｜ 本站收錄 <b id="footIssues">–</b> 期、<b id="footPages">–</b> 個版面 ｜ 資料更新：<span id="footBuilt">–</span></p>
    </div>
  </div>
</footer>

<!-- 閱讀器 -->
<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button class="rbtn" id="rClose" title="關閉 (Esc)"><svg class="ic"><use href="#i-close"/></svg><span>關閉</span></button>
    <div class="reader-title" id="rTitle"></div>
    <div class="reader-actions">
      <button class="rbtn" id="rZoomOut" title="縮小 (-)"><svg class="ic"><use href="#i-minus"/></svg></button>
      <span class="zoomval" id="rZoomVal">100%</span>
      <button class="rbtn" id="rZoomIn" title="放大 (+)"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="rbtn" id="rFit" title="符合視窗 (0)"><svg class="ic"><use href="#i-fit"/></svg></button>
      <button class="rbtn" id="rText" title="文字面板 (T)"><svg class="ic"><use href="#i-text"/></svg><span>文字</span></button>
      <button class="rbtn" id="rFav" title="收藏此版 (F)"><svg class="ic"><use href="#i-heart"/></svg></button>
      <a class="rbtn" id="rOrig" target="_blank" title="開啟原始高解析檔"><svg class="ic"><use href="#i-download"/></svg><span>原檔</span></a>
      <button class="rbtn" id="rFull" title="全螢幕"><svg class="ic"><use href="#i-full"/></svg></button>
    </div>
  </div>
  <div class="reader-body">
    <button class="flip prev" id="rPrev" title="上一版 (←)"><svg class="ic"><use href="#i-left"/></svg></button>
    <div class="stage" id="rStage">
      <div class="canvas" id="rCanvas">
        <img id="rImg" alt="">
        <div class="boxes" id="rBoxes"></div>
      </div>
      <div class="loading" id="rLoading"><span class="spinner"></span>翻頁中…</div>
    </div>
    <button class="flip next" id="rNext" title="下一版 (→)"><svg class="ic"><use href="#i-right"/></svg></button>
    <aside class="textpanel" id="rPanel" hidden>
      <div class="tp-head">
        <b>本版文字</b><small>（電腦自動辨識，可能有誤字）</small>
        <input type="search" id="rFind" placeholder="在本版中尋找…">
      </div>
      <div class="tp-body" id="rPanelBody"></div>
    </aside>
  </div>
  <div class="reader-strip" id="rStrip"></div>
  <div class="reader-hint">滾輪／雙指縮放 · 拖曳移動 · 雙擊放大 · ← → 翻頁</div>
</div>

<!-- 設定 -->
<div class="modal" id="settings" hidden>
  <div class="modal-card" role="dialog" aria-labelledby="setTitle">
    <button class="modal-x" data-close><svg class="ic"><use href="#i-close"/></svg></button>
    <h2 id="setTitle"><svg class="ic"><use href="#i-gear"/></svg>網站設定</h2>
    <div class="set-list" id="setList"></div>
    <div class="set-foot">
      <button class="btn ghost" id="setReset">恢復預設</button>
      <button class="btn danger" id="setClear">清除我的足跡</button>
    </div>
  </div>
</div>

<!-- 通知 -->
<div class="toasts" id="toasts" aria-live="polite"></div>
